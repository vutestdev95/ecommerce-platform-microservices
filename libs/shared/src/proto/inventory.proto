syntax="proto3";

package inventory;

service InventoryService {
  rpc FindByProductId (ProductIdRequest) returns (InventoryResponse);
  rpc Reserve (StockRequest) returns (InventoryResponse);
  rpc Release (StockRequest) returns (InventoryResponse);
  rpc Confirm (StockRequest) returns (InventoryResponse);
}

message ProductIdRequest {
  string product_id = 1;
}

message StockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message InventoryResponse {
  string id = 1;
  string product_id = 2;
  int32 quantity = 3;
  int32 reserved_quantity = 4;
  int32 available_quantity = 5;
}